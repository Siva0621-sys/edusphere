<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | EduSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background:var(--bg-body);">

  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">E</div>
        <div class="brand-name">
          <span class="brand-name-main"><span class="institute-name">EduSphere</span></span>
          <span class="brand-tagline-mini institute-tagline">Learn Better. Grow Smarter.</span>
        </div>
      </a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Set New Password</h2>
        <p>Choose a secure password for your EduSphere account.</p>
      </div>

      <form id="setNewPassForm">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password <span class="required-star">*</span></label>
          <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirm New Password <span class="required-star">*</span></label>
          <input type="password" id="confirmNewPassword" class="form-control" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Update Password &rarr;
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { showToast } from './js/main.js';

    document.getElementById('setNewPassForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmNewPassword').value;

      if (p1.length < 6) {
        showToast('Password Too Short', 'Password must be at least 6 characters.', 'error');
        return;
      }
      if (p1 !== p2) {
        showToast('Mismatch', 'Passwords do not match.', 'error');
        return;
      }

      showToast('Password Updated Successfully', 'You can now log in with your new password.', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    });
  </script>
</body>
</html>
