version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: edusphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: edusphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edusphere_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:123@postgres:5432/edusphere_db?schema=public"
      JWT_SECRET: "edusphere_docker_secret_key_2026"
      PORT: 5000
    depends_on:
      - postgres

volumes:
  postgres_data:
